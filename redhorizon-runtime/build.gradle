plugins {
	id 'redhorizon-library'
}

description = 'Runtime package for building applications with the Red Horizon engine'

configure {
	asGroovyLibraryProject()
		.withGroovydocOptions() {
			link("https://javadoc.io/doc/nz.net.ultraq/redhorizon-assets/${version}/", 'nz.net.ultraq.redhorizon.assets.')
			link("https://javadoc.io/doc/nz.net.ultraq/redhorizon-audio/${version}/", 'nz.net.ultraq.redhorizon.audio.')
			link("https://javadoc.io/doc/nz.net.ultraq/redhorizon-classic/${version}/", 'nz.net.ultraq.redhorizon.classic.')
			link("https://javadoc.io/doc/nz.net.ultraq/redhorizon-core/${version}/", 'nz.net.ultraq.redhorizon.')
			link("https://javadoc.io/doc/nz.net.ultraq/redhorizon-graphics/${version}/", 'nz.net.ultraq.redhorizon.graphics.')
			link("https://javadoc.io/doc/nz.net.ultraq/redhorizon-simulation/${version}/", 'nz.net.ultraq.redhorizon.simulation.')
			link("https://javadoc.io/doc/org.joml.primitives/joml-primitives/${jomlPrimitivesVersion}", 'org.joml.primitives.')
		}
		.withJarOptions() {
			manifest {
				attributes 'Automatic-Module-Name': 'nz.net.ultraq.redhorizon.runtime'
			}
		}
		.configureSource()
			.withDependencies() {
				implementation project(':redhorizon-core')
				implementation "org.joml:joml-primitives:${jomlPrimitivesVersion}"
				api project(':redhorizon-assets')
				api project(':redhorizon-audio')
				api project(':redhorizon-classic')
				api project(':redhorizon-graphics')
				api project(':redhorizon-simulation')
			}
		.configureVerification()
			.withTestDependencies() {
				testImplementation "ch.qos.logback:logback-classic:${logbackVersion}"
			}
}
