plugins {
	id 'redhorizon-library'
}

description = 'Extensions to JOML objects to make some operations easier'

configure {
	asGroovyLibraryProject()
		.withGroovyCompileOptions() {
			groovyOptions.configurationScript = file('config.groovy')
		}
		.withGroovydocOptions() {
			link("https://javadoc.io/doc/org.joml/joml/${jomlVersion}", 'org.joml.')
			link("https://javadoc.io/doc/org.joml/joml-primitives/${jomlPrimitivesVersion}", 'org.joml.primitives.')
		}
		.withJarOptions() {
			manifest {
				attributes 'Automatic-Module-Name': 'nz.net.ultraq.redhorizon.jomlextensions'
			}
		}
		.configureSource()
			.withDependencies() {
				api "org.joml:joml:${jomlVersion}"
				api "org.joml:joml-primitives:${jomlPrimitivesVersion}"
			}
}
